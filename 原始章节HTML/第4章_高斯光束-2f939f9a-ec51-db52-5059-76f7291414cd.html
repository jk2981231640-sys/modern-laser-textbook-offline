<p style="line-height: 2;">&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style="text-indent: 32px;">高斯光束是</span><span style="text-indent: 32px; text-align: inherit; word-spacing: 0ch;">所有可能存在的激光波型的概称。理论和实践已证明，在可能存在的激光束形式中最重要且最具典型意义的是基模高斯光束。高阶模激光束的场分布不同于基模，但传输与变换规律和基模高斯光束相同，称为高阶模高斯光束。非稳腔输出的基模光束经准直后在远场的强度分布也接近高斯型。</span></p>
<p style="line-height: 2; text-indent: calc(var(--theme-font-size,1em) * 2);">方形镜与圆形镜的<span style="text-indent: 32px;">基模高斯光束相同。基模在横截面上的光强分布为一圆斑，中心处光强最强，向边缘方向光强逐渐减弱，呈高斯型分布。将光斑的尺寸通常定义为光强降至最大值的<img data-custom-template="true" data-latex-font-size="normalsize" data-size="2017" class="latex-editor-img " src="Material/svg/latex-image9c2cb81e-0ddf-4f40-8354-e27dce1c7038.svg" data-latex-2="$\dfrac{1}{e^2}$" data-latex-imageid="9c2cb81e-0ddf-4f40-8354-e27dce1c7038" data-color="#000">（大约13.5%）时光束的位置到光束中心距离的两倍。</span></p>
