<p style="line-height: 2;">&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<span style="color: #333333; font-family: SourceHanSerif-Regular, 思源宋体-Regular; text-indent: 32px;">二十一世纪被公认为是光子的时代，光子学说认为光是一种以光速</span><img data-custom-template="true" data-latex-font-size="normalsize" data-size="900" class="latex-editor-img " data-latexid="latexb3e07b52-3aaf-5dc0-6159-3ac22df39f78" src="Material/svg/latex-imageb3e07b52-3aaf-5dc0-6159-3ac22df39f78.svg" data-latex-2="$c$" data-latex-imageid="b3e07b52-3aaf-5dc0-6159-3ac22df39f78" data-color="#000" data-bookid="f3003836-2c78-a048-63f1-4ff6cff7b068" data-material-prefix="https://editor-oss.bhpressshuzi.cn/etextbook/books" data-copy-src="Material/svg/latex-imageb3e07b52-3aaf-5dc0-6159-3ac22df39f78.svg" style="color: #333333; font-family: SourceHanSerif-Regular, 思源宋体-Regular; text-indent: 32px;"><span style="color: #333333; font-family: SourceHanSerif-Regular, 思源宋体-Regular; text-indent: 32px;">运动的光子流。与光波具有波粒二象性一样，光子的基本性质除粒子属性（能量、动量、质量等）外，还包含和波动属性（频率、波矢、偏振等）。光子具有两种可能的独立偏振状态，它是自旋量子数为整数的玻色子，也就是说大量光子的集合服从玻色—爱因斯坦统计规律，即处于同一状态的光子数目没有限制，因此可以证明同一个光子态的光子是相干的。激光产生是以一个光子或量子为单位、大量光子的不连续的与物质相互作用的过程，这是激光发明和发展的物理基础。</span></p>
