    <title>轮播图</title>
    <link rel="stylesheet" href="/etextbook/public/js/Swiper/swiper.10.3.1.css">
    <style>

        /* 添加CSS样式 */
        .swiper {
            width: 100%;
            height: 100vh; /* 使用视口高度 */
            --swiper-pagination-bottom:8px;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 22px); /* 使用视口高度 */

        }

        .slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 0;
            box-sizing: border-box;
        }

        .slide-container-img{
            height: 100%;
            min-height: 0;
        }
        .slide-container img {
            max-width: 100%;
            height: 100%;
            //max-height: 80vh; /* 给标题留出空间 */
            object-fit: contain;
        }

        .slide-caption {
            padding: 0 10px;
            text-align: center;
            font-size: 14px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            height: 38px;
            min-height: 38px;
            line-height: 1.4;
        }

        .swiper-autoheight .swiper-wrapper{
            height: 100vh;
        }
        /* 确保导航按钮在可视区域内 */
        //.swiper-button-prev, .swiper-button-next {
        //    color: #000;
        //    top: 50%;
        //    transform: translateY(-50%);

    </style>
</head>

<body>
<script src="/etextbook/public/js/Swiper/swiper.10.3.1.js"></script>

        <!-- 如果需要分页器 -->
        <div class="swiper-pagination"></div>

        <!-- 如果需要导航按钮 -->

        <div class="swiper-button-next" tabindex="0" role="button" aria-label="Next slide"
            aria-controls="swiper-wrapper-10fc5101cc0272d610f"></div>

    <script>

      onload = function () {
        var swiperWrapper = document.getElementById("swiper-wrapper-10fc5101cc0272d610f");

        // 先清空现有内容
        swiperWrapper.innerHTML = '';

        for (var i = 0; i < window.imgList.length; i++) {
          var item = window.imgList[i];
          var swiperSlide = document.createElement("div");
          swiperSlide.className = "swiper-slide";

          // 这块要改成图片一屏展示，宽度自适应，高度根据屏幕高度来适配
          var ele = `
                 <div class="slide-container">
                    <div class="slide-container-img">
                        <img src="${item.src}" alt="${item.name}">
                    </div>

                    <div class="slide-caption">${item.name}</div>
                </div>
            `;

          swiperSlide.innerHTML = ele;
          swiperWrapper.appendChild(swiperSlide);
        }


        var mySwiper = new Swiper(".swiper", {
          loop: true,
          pagination: {
            el: ".swiper-pagination"
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev"
          },
          // 添加自适应参数
          slidesPerView: 1,
          spaceBetween: 20,
          // autoHeight: true,
          breakpoints: {
            // 当屏幕宽度 >= 768px 时的配置
            768: {
              slidesPerView: 1,
              spaceBetween: 30
            }
          },
          on: {
            init: function() {
            },
            slideChange: function(e) {
            },
            activeIndexChange: function(e) {
              mySwiper.updateSize()
            },

          }
        });

        // 窗口大小改变时重新计算
        window.addEventListener('resize', function() {
          mySwiper.update();
        });
      };
    </script>
